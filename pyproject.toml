[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amaterasu"
version = "0.1.0a2"
description = "Plane-wave / mixed-basis density functional theory for 3D periodic crystals"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Yusuke N." }]
keywords = ["dft", "density-functional-theory", "plane-wave", "paw", "materials-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "ase>=3.23",
    "spglib>=2.0",
    "h5py>=3.8",
    "PyYAML>=6.0",
    "seekpath>=2.0",
]

[project.optional-dependencies]
# numba is not a hard dependency: amaterasu._kernels is still an empty placeholder and
# nothing imports numba yet (the compiled kernels land in Phase 9). Declaring it here
# rather than in [project] dependencies keeps a plain install off llvmlite, which lags
# new Python releases, for a package that would never call it.
jit     = ["numba>=0.59"]
mpi     = ["mpi4py>=3.1"]
fftw    = ["pyfftw>=0.13"]
phonons = ["phonopy>=2.20"]
plot    = ["matplotlib>=3.7"]
# libxc's Python bindings are deliberately absent here: they are not on PyPI (the
# "pylibxc"/"pylibxc2" names there are unrelated stubs) and must be built from source.
# See the Testing section of README.md. Tests needing them skip when they are missing.
test    = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6"]
all     = ["amaterasu[jit,mpi,fftw,phonons,plot,test]"]

[project.scripts]
amaterasu = "amaterasu.cli:main"

[project.urls]
Homepage = "https://github.com/ysknoda/amaterasu"
Issues   = "https://github.com/ysknoda/amaterasu/issues"

[tool.hatch.build.targets.wheel]
packages = ["amaterasu"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
    "E741",    # ambiguous variable names: l (angular momentum) is standard notation here
    "RUF001",  # ambiguous unicode in strings: physics uses Greek letters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# SIM300 flags "assert value == pytest.approx(expected)" as a Yoda condition, but that is
# the idiomatic pytest form and its suggested rewrite reads backwards.
"tests/**" = ["E501", "SIM300"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests", "amaterasu"]
# --doctest-modules keeps the worked examples in the docstrings honest; a stale example is
# documentation that lies.
addopts = "-q --strict-markers --doctest-modules"
markers = [
    "physics: slow validation runs against reference physical data (deselect with '-m \"not physics\"')",
    "slow: takes more than ~30 s",
]
filterwarnings = [
    # CI runs with -W error::DeprecationWarning so that a deprecation *we* introduce fails
    # the build. This one is not ours and cannot be fixed here: ase.Atoms.new_array assigns
    # to ndarray.shape (ase/atoms.py, reached from Atoms.copy()), which NumPy 2.5 deprecated.
    # Matched by message rather than by module, because the filter's module field matches
    # the warning's reported origin, which stacklevel puts in the calling module. amaterasu
    # never assigns to .shape itself, so nothing of ours is hidden by this.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
