name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, to run the slow physics validation suite that PRs skip.
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test]"
      # Deprecation warnings from our own call sites are bugs; third-party ones are
      # silenced at the call site (see amaterasu.system.symmetry). The one exception is
      # inside ase.Atoms.new_array, which assigns to ndarray.shape -- deprecated in NumPy
      # 2.5 -- and so cannot be silenced at any call site of ours. A -W filter given later
      # wins over an earlier one, and pytest's own filterwarnings ini entry loses to -W
      # entirely, so the exemption has to be spelled out here rather than in pyproject.
      - run: >-
          pytest -m "not physics"
          -W error::DeprecationWarning
          -W 'ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning'

  physics:
    # The physics suite validates against reference data (equations of state, delta-factor,
    # literature values) and is far too slow for every push.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test,phonons,plot]"
      # libxc is not on PyPI, so the exchange-correlation reference is built from source.
      # Only the nightly job pays this cost; the fast job skips those tests.
      - name: Build libxc
        run: |
          curl -sL -o libxc.tar.gz https://gitlab.com/libxc/libxc/-/archive/7.1.2/libxc-7.1.2.tar.gz
          tar xzf libxc.tar.gz
          pip install ./libxc-7.1.2
      - run: pytest -m physics --durations=20
      - run: pytest tests/unit/test_libxc_reference.py
